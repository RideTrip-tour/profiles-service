[tool.ruff]
target-version = "py312"
exclude = [
    "alembic/versions",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F403"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"
